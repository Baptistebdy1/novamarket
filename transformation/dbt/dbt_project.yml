name: novamarket_dbt
version: "1.0.0"
config-version: 2
profile: novamarket_dbt
model-paths: ["models"]
test-paths: ["tests"]
snapshot-paths: ["snapshots"]
clean-targets: ["target", "dbt_packages"]

# Matérialisation choisie par couche (S4 · M4) :
# - staging      : vue     -> simple renommage/typage, toujours à jour, pas de stockage ;
# - intermediate : éphémère -> pas d'objet en base, le SQL est injecté en CTE dans le mart ;
#                             (règle réutilisable sans créer une relation de plus) ;
# - marts        : table   -> résultat publié pour l'analyse/BI, lu souvent, recalculé au run.
models:
  novamarket_dbt:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: ephemeral
    marts:
      +materialized: table
      +schema: marts
